spring.application.name=ebingo-server-backend
server.port=8080
# --- R2DBC (Reactive Postgres) ---
spring.r2dbc.url=${EBINGO_DB_URL:r2dbc:postgresql://localhost:5432/ebingo}
spring.r2dbc.username=${EBINGO_DB_USER:ebingo}
spring.r2dbc.password=${EBINGO_DB_PASSWORD:Zakinfo@23}
# Note: driver-class-name, hikari pool, and JPA dialect are NOT needed in reactive setup
# spring.datasource.driver-class-name=${DATASOURCE_DRIVER:org.postgresql.Driver}
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# spring.jpa.database=POSTGRESQL
# spring.datasource.hikari.maximum-pool-size=${DATASOURCE_MAX_POOL_SIZE:10}
# spring.datasource.hikari.minimum-idle=${DATASOURCE_MIN_IDLE:5}
# spring.datasource.hikari.pool-name=HikariPool-1
# --- Flyway (optional, still uses JDBC) ---
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.url=${EBINGO_DB_URL:jdbc:postgresql://localhost:5432/ebingo}
spring.flyway.user=${EBINGO_DB_USER:ebingo}
spring.flyway.password=${EBINGO_DB_PASSWORD:Zakinfo@23}
# --- Swagger / Springdoc ---
springdoc.swagger-ui.path=/docs
springdoc.swagger-ui.doc-expansion=none
# --- OAuth2 / Security (works the same in reactive) ---
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://rzdbiyfgnowpkkbmotaa.supabase.co/auth/v1/.well-known/jwks.json
bingo.card.size:25
bingo.card.maxCardsPerPlayer:2
bingo.draw.intervalSeconds:3
spring.data.redis.timeout=10s