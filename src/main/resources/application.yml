spring:
  application:
    name: ebingo-server-backend
  r2dbc:
    url: ${EBINGO_DB_URL:}
    username: ${EBINGO_DB_USER:}
    password: ${EBINGO_DB_PASSWORD:}
  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    url: ${EBINGO_DB_URL:r2dbc:postgresql://localhost:5432/ebingo}
    user: ${EBINGO_DB_USER:ebingo}
    password: ${EBINGO_DB_PASSWORD:Zakinfo@23}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWK_ENDPOINT}
  data:
    redis:
      timeout: 10s

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /docs
    doc-expansion: none

bingo:
  card:
    size: 25
    maxCardsPerPlayer: 2
  draw:
    intervalSeconds: 3
